name: CI

on:
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-26.04-arm
    container: ghcr.io/knight-owl-dev/ci-tools:v1.8.2@sha256:281cd81c83138f438cdc6e03b114213b9beab7c44ae1553953a3661cb4706abc

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lint
        run: make lint

  validate:
    runs-on: ubuntu-26.04-arm
    container: ghcr.io/knight-owl-dev/ci-tools:v1.8.2@sha256:281cd81c83138f438cdc6e03b114213b9beab7c44ae1553953a3661cb4706abc

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The container runs as a different user than the checkout's owner, so git
      # refuses the repository. safe.directory is read only from protected config.
      - name: Trust the checkout
        run: git config --global --add safe.directory "${GITHUB_WORKSPACE}"

      - name: Validate repository generation
        env:
          GH_TOKEN: ${{ github.token }}
        run: make validate

      - name: Restore dists/
        run: git restore dists/
