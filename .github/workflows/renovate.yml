name: Renovate

# Opens a PR when a dependency this repo pins has moved. What it scans and how
# it groups is in .github/renovate.jsonc.

on:
  schedule:
    # Monday at 07:00 UTC
    - cron: '0 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: renovate

jobs:
  renovate:
    name: Update Dependencies
    runs-on: ubuntu-26.04-arm

    # No checkout: Renovate clones the repository itself and reads
    # .github/renovate.jsonc from that clone.
    steps:
      - name: Generate GitHub App token
        id: app-token
        # Needs contents:write (push the update branch), pull-requests:write
        # (open the PR) and issues:write (the dependency dashboard is an issue).
        # A PR opened with GITHUB_TOKEN would not trigger CI.
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}

      - name: Run Renovate
        # The image itself, not renovatebot/github-action: no wrapper action
        # holds the App token.
        uses: docker://ghcr.io/renovatebot/renovate:44.135.0@sha256:cada8681f79e153506daf4e89e5fc405efb281a7d8f9d9fc5e3eb54d5b74bc85
        env:
          RENOVATE_TOKEN: ${{ steps.app-token.outputs.token }}
          RENOVATE_REPOSITORIES: ${{ github.repository }}
