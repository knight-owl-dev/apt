name: Renovate

# Opens a PR when a dependency this repo pins has moved. What it scans and how
# it groups is in .github/renovate.jsonc.

on:
  schedule:
    # Monday at 07:00 UTC
    - cron: '0 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: renovate

jobs:
  renovate:
    name: Update Dependencies
    runs-on: ubuntu-26.04-arm

    # No checkout: Renovate clones the repository itself and reads
    # .github/renovate.jsonc from that clone.
    steps:
      - name: Generate GitHub App token
        id: app-token
        # Needs contents:write (push the update branch), pull-requests:write
        # (open the PR) and issues:write (the dependency dashboard is an issue).
        # A PR opened with GITHUB_TOKEN would not trigger CI.
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}

      - name: Run Renovate
        # The image itself, not renovatebot/github-action: no wrapper action
        # holds the App token.
        uses: docker://ghcr.io/renovatebot/renovate:44.183.0@sha256:bc0efebde12e3cb457b6577348b7194d79dcfaa29e4fa6aacd4a1856e3540cbc
        env:
          RENOVATE_TOKEN: ${{ steps.app-token.outputs.token }}
          RENOVATE_REPOSITORIES: ${{ github.repository }}
